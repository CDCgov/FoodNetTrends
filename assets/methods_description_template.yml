description: |
  <p style="font-size:0.9em">The bioinformatics analysis of the data was carried out using the CDCgov/FoodNetTrends
  analysis pipeline. The pipeline uses Nextflow, a workflow tool to run tasks across multiple compute infrastructures
  in a portable, reproducible manner.</p>

  <p style="font-size:0.9em">Data was processed using CDCgov/FoodNetTrends v${meta.manifest_map.version} ${meta.doi_text} of the nf-core collection of workflows (<a href="https://doi.org/10.1038/s41587-020-0439-x">Ewels <em>et al.</em>, 2020</a>), utilizing reproducible software containers from the Biocontainers project (<a href="https://doi.org/10.1093/bioinformatics/btx192">da Veiga Leprevost <em>et al.</em>, 2017</a>).</p>

  <h4>Methods overview</h4>
  <p style="font-size:0.9em">This spline modeling workflow analyzes FoodNet surveillance data to estimate trends in foodborne illness incidence rates. The workflow processes raw surveillance data, applies Bayesian hierarchical models to estimate trends, and generates visualizations and summary statistics.</p>

  <h4>Key analysis steps</h4>
  <ul style="font-size:0.9em">
    <li>Data preprocessing: clean and standardize raw surveillance records</li>
    <li>Apply Bayesian hierarchical spline models to estimate pathogen trends over time</li>
    <li>Generate age- and state-adjusted incidence rates</li>
    <li>Produce visualizations and summary statistics</li>
  </ul>

  <h4>Software dependencies</h4>
  <p style="font-size:0.9em">The pipeline uses R and Stan for statistical modeling and data visualization.</p>

  <h4>References</h4>
  <ul style="font-size:0.9em">
    <li>Di Tommaso, P., Chatzou, M., Floden, E. W., Barja, P. P., Palumbo, E., & Notredame, C. (2017). Nextflow enables reproducible computational workflows. Nature Biotechnology, 35(4), 316-319. https://doi.org/10.1038/nbt.3820</li>
    <li>Ewels, P., Magnusson, M., Lundin, S., & Käller, M. (2020). The nf-core framework for community-curated bioinformatics pipelines. Nature Biotechnology, 38(3), 276-278. https://doi.org/10.1038/s41587-020-0439-x</li>
    <li>Stan Development Team. (2022). Stan Modeling Language Users Guide and Reference Manual, Version 2.30.1. https://mc-stan.org</li>
    ${meta.nodoi_text}
  </ul>

